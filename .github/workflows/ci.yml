name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A PR branch gets one verification per commit, not duplicate push+PR runs.
# Superseded PR checks are cancelled; releases from main must not be cancelled.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: pwsh -NoProfile -File tools/setup-android-signing.ps1 -ValidateOnly
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: npm run build
      - run: npx playwright install chromium --only-shell
      - run: npm run test:e2e
      - run: npm run test:pwa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          cmdline-tools-version: '13114758'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run android:build
      - run: npm run android:verify
      - run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose apps/android/android/app/build/outputs/apk/debug/app-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: pc-tycoon-debug-apk
          path: apps/android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
