name: Android debug GitHub Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Choose unique versioned beta Release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          node tools/release_version.mjs "v$VERSION" >/dev/null
          TAG="v$VERSION-beta.$GITHUB_RUN_NUMBER"
          echo "PCT_RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "PCT_VERSION_NAME=$VERSION-beta.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "PCT_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          cmdline-tools-version: '13114758'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: npm run android:sync
      - name: Build automatically signed Debug APK
        working-directory: apps/android/android
        run: ./gradlew --no-daemon assembleDebug
      - run: npx playwright install chromium --only-shell
      - run: npm run test:e2e
      - run: npm run test:pwa
      - name: Verify self-contained Debug APK, Android version, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=apps/android/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          PCT_VERIFY_APK="$APK" python3 tools/verify_apk.py
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "versionCode='$PCT_VERSION_CODE'"
          printf '%s\n' "$BADGING" | grep -F "versionName='$PCT_VERSION_NAME'"
      - name: Prepare APK asset and checksum
        shell: bash
        run: |
          set -euo pipefail
          BASENAME="PC-Tycoon-Enhanced-$PCT_RELEASE_TAG.apk"
          cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/$BASENAME"
          (cd "$RUNNER_TEMP" && sha256sum "$BASENAME" > "$BASENAME.sha256")
          echo "Release $PCT_RELEASE_TAG from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/$BASENAME.sha256" >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub prerelease as draft with a direct APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASENAME="PC-Tycoon-Enhanced-$PCT_RELEASE_TAG.apk"
          gh release create "$PCT_RELEASE_TAG" "$RUNNER_TEMP/$BASENAME" "$RUNNER_TEMP/$BASENAME.sha256" \
            --target "$GITHUB_SHA" --title "PC Tycoon Enhanced $PCT_RELEASE_TAG" --prerelease --draft \
            --notes "Personal testing build from main at $GITHUB_SHA. This APK uses the GitHub runner's temporary Android debug signing key, so installing a future build over it is not guaranteed. Export your game save to JSON before uninstalling or updating. The private repository requires GitHub access to download."
      - name: Publish only after verifying both Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASENAME="PC-Tycoon-Enhanced-$PCT_RELEASE_TAG.apk"
          ASSETS="$(gh release view "$PCT_RELEASE_TAG" --json assets --jq '.assets[].name')"
          printf '%s\n' "$ASSETS" | grep -Fx "$BASENAME"
          printf '%s\n' "$ASSETS" | grep -Fx "$BASENAME.sha256"
          gh release edit "$PCT_RELEASE_TAG" --draft=false --prerelease
