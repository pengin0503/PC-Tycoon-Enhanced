name: Android emulator acceptance
on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'tools/android-emulator-smoke.sh'
      - '.github/workflows/android-emulator-qa.yml'
  workflow_dispatch:
concurrency:
  group: pct-android-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          cmdline-tools-version: '13114758'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run android:sync
      - name: Build initial emulator Debug APK, versionCode 1001
        working-directory: apps/android/android
        env:
          PCT_VERSION_CODE: '1001'
          PCT_VERSION_NAME: emulator.qa.1
        run: ./gradlew --no-daemon assembleDebug
      # Hosted Linux runners only give the emulator hardware acceleration when /dev/kvm is accessible; without it the
      # emulator falls back to software emulation and needs ~15 minutes just to boot (the endless boot_completed polling).
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run an Android emulator and verify in-place upgrade, Back and offline restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash tools/android-emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-evidence
          path: test-results/android-emulator/
          if-no-files-found: warn
